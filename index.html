<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b10">
<title>Diablo Lab — Experimento</title>
<style>
:root{color-scheme:dark;--gold:#e4b76c;--muted:#a9a4a2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#36202b 0%,#17121b 42%,#09090e 85%);color:#f5eee6;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;padding:24px clamp(24px,7vw,100px);border-bottom:1px solid #ffffff18}.brand{font-family:Georgia,serif;letter-spacing:.18em;color:var(--gold);font-weight:bold}.tag{font-size:.75rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}main{flex:1;display:grid;place-items:center;padding:60px 24px;text-align:center}.hero{max-width:790px}.sigil{width:120px;height:120px;margin:0 auto 34px;border:1px solid #a67a4d;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 65px #b141322b,inset 0 0 30px #b141321e;font-family:Georgia,serif;color:var(--gold);font-size:70px;text-shadow:0 0 28px #b84239;transform:rotate(-8deg)}.eyebrow{color:var(--gold);letter-spacing:.34em;text-transform:uppercase;font-size:.75rem}h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(3.6rem,11vw,8rem);letter-spacing:.06em;margin:12px 0 8px;line-height:1.04;text-shadow:0 8px 38px #000}h1 span{color:var(--gold)}p{font-size:clamp(1rem,2.5vw,1.25rem);line-height:1.8;color:#c7c0bd;max-width:590px;margin:24px auto 34px}.rule{height:1px;width:150px;margin:24px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}.chips{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.chip{border:1px solid #a67a4d66;padding:11px 16px;border-radius:3px;color:#d9c3a6;font-size:.8rem;letter-spacing:.08em;background:#0004}footer{text-align:center;padding:25px;color:#89818a;font-size:.75rem;letter-spacing:.12em;border-top:1px solid #ffffff12}@media(prefers-reduced-motion:no-preference){.sigil{animation:pulse 5s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 95px #b1413245,inset 0 0 45px #b141322b}}}
</style>
</head>
<body>
<header><div class="brand">✦ DIABLO LAB</div><div class="tag">Protótipo · 001</div></header>
<main><section class="hero" aria-labelledby="title">
<div class="sigil" aria-hidden="true">Ⅳ</div>
<div class="eyebrow">Teoria · Experimento · Descoberta</div>
<h1 id="title">DIABLO <span>LAB</span></h1>
<div class="rule"></div>
<p>Nem toda build precisa seguir o meta. Um laboratório para explorar as mecânicas de Diablo IV, testar hipóteses e descobrir novas formas de jogar.</p>
<div class="chips"><span class="chip">⚔ DANO</span><span class="chip">◈ SINERGIAS</span><span class="chip">✧ EXPERIMENTOS</span></div>
</section></main>
<footer>FEITO PARA QUEM PREFERE DESCOBRIR.</footer>
</body></html>
